<html lang="en">
<head>
<meta charset="UTF-8">

<title>Global Conflict Map — 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f0e;--surface:#141614;--border:#2a2d2a;
  --text:#d4cfc0;--muted:#7a7870;--accent:#C84315;
  --hdr:46px;--sheet:0px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;height:100%;overflow:hidden}

/* ── HEADER ── */
#header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:var(--bg);border-bottom:1px solid var(--border);
  height:var(--hdr);padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
#header h1{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;white-space:nowrap}
#header .sub{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:10px;white-space:nowrap}
#hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* desktop filter strip */
#filter-strip{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.filter-btn{
  font-family:'Space Mono',monospace;font-size:9px;
  background:none;border:1px solid var(--border);
  color:var(--muted);padding:3px 7px;cursor:pointer;
  letter-spacing:.05em;text-transform:uppercase;border-radius:2px;transition:all .15s;
}
.filter-btn:hover,.filter-btn.on{border-color:var(--accent);color:var(--accent)}
.filter-btn.on{background:#C8431518}

/* mobile filter toggle */
#filter-toggle{
  display:none;
  font-family:'Space Mono',monospace;font-size:9px;
  background:none;border:1px solid var(--border);
  color:var(--muted);padding:4px 10px;cursor:pointer;
  letter-spacing:.06em;text-transform:uppercase;border-radius:2px;
}
#filter-toggle.open{border-color:var(--accent);color:var(--accent);background:#C8431518}

/* ── FILTER DRAWER (mobile) ── */
#filter-drawer{
  position:fixed;top:var(--hdr);left:0;right:0;z-index:39;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 14px;
  display:none;flex-wrap:wrap;gap:6px;
}
#filter-drawer.open{display:flex}

/* ── MAP ── */
#map-wrap{
  position:fixed;top:var(--hdr);left:0;right:0;bottom:0;
  overflow:hidden;
}
#wm{width:100%;height:100%;cursor:grab;touch-action:none}
#wm:active{cursor:grabbing}

/* ── BOTTOM SHEET ── */
#sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--border);
  transform:translateY(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  max-height:55vh;overflow-y:auto;
}
#sheet.open{transform:translateY(0)}
#sheet-handle{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 6px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);
}
#sheet-title{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:700;color:var(--text)}
#sheet-close{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:18px;line-height:1;padding:0 2px;
}
#sheet-body{padding:10px 16px 16px;font-size:11px;line-height:1.6;color:var(--muted)}
#sheet-body .row{
  border-left:2px solid var(--border);padding:6px 0 6px 10px;margin-bottom:8px;
}
#sheet-body .row .type{font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
#sheet-body .row .detail{color:var(--text)}

/* ── DESKTOP LEGEND (bottom bar) ── */
#legend{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--bg);border-top:1px solid var(--border);
  padding:7px 16px 9px;
  display:flex;flex-wrap:wrap;gap:5px 16px;align-items:center;
}
.li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.li svg{flex-shrink:0}
#count-hint{margin-left:auto;font-size:9px;color:var(--muted);white-space:nowrap}

/* ── DESKTOP NODE PANEL ── */
#nodepanel{
  position:fixed;top:54px;right:14px;z-index:35;
  background:var(--surface);border:1px solid var(--border);
  width:210px;font-size:10px;color:var(--text);
  display:none;max-height:calc(100vh - 80px);overflow-y:auto;
}
#nodepanel .nph{
  background:var(--accent);padding:7px 10px;
  font-family:'Playfair Display',Georgia,serif;font-size:13px;color:#fff;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;
}
#nodepanel .nph button{background:none;border:none;color:#ffffffaa;cursor:pointer;font-size:16px;line-height:1}
#nodepanel .nprows{padding:8px 10px}
#nodepanel .nprow{margin:0 0 7px;color:var(--muted);line-height:1.5;border-left:2px solid var(--border);padding-left:6px}
#nodepanel .nprow .npt{font-size:8px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px}
#nodepanel .nprow span{color:var(--text)}

/* ── HOVER TOOLTIP (desktop only) ── */
#tooltip{
  position:fixed;background:var(--surface);border:1px solid var(--border);
  padding:5px 11px;font-size:11px;color:var(--text);
  pointer-events:none;white-space:nowrap;max-width:340px;white-space:normal;line-height:1.4;
  opacity:0;transition:opacity .1s;z-index:60;
  border-left:2px solid var(--accent);
}

.arc-path{fill:none;cursor:crosshair}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  #filter-strip{display:none}
  #filter-toggle{display:block}
  #legend{display:none}
  #nodepanel{display:none!important}
  #count-hint{display:none}
  #map-wrap{bottom:0}
}
@media(min-width:769px){
  #filter-drawer{display:none!important}
  #sheet{display:none!important}
  #map-wrap{bottom:88px}
}
</style>

  {s:'China',    t:'USA',        type:'cyber',    lb:'China: cyberwarfare vs USA'},
  {s:'China',    t:'SE Asia',    type:'cyber',    lb:'China: long-running cyber espionage vs SE Asian militaries (since 2020).'},
  {s:'USA',      t:'China',      type:'cyber',    lb:'USA: cyberwarfare vs China'},
  {s:'USA',      t:'Russia',     type:'cyber',    lb:'USA: cyberwarfare vs Russia'},
  {s:'USA',      t:'Iran',       type:'cyber',    lb:'USA: cyberwarfare vs Iran'},
  {s:'N.Korea',  t:'USA',        type:'cyber',    lb:'N.Korea: IT worker infiltration using deepfakes. Revenue for weapons programs.'},
  {s:'S.Arabia', t:'Israel',     type:'complex',  lb:'Gulf States–Israel: no war / no peace. Abraham Accords partial. Saudi normalization on hold.'},
  {s:'Haiti',    t:'Haiti',      type:'complex',  lb:'Haiti: 150–200 gangs control 85–90% of Port-au-Prince. Highest homicide rate on Earth. Transitional government winding down Feb 2026.'},
  {s:'Mexico',   t:'Mexico',     type:'complex',  lb:'Mexico Drug War: CJNG vs Sinaloa Cartel vs state forces. State complicity blurs lines. US designated cartels; scope of intervention unclear post-Venezuela.'},
  {s:'Colombia', t:'Colombia',   type:'complex',  lb:'Colombia: drug trafficking embedded in state. Peace process with ELN stalled. Criminal governance expanding.'},
  {s:'Sahel',    t:'Sahel',      type:'complex',  lb:'Sahel Juntas (Mali, Burkina Faso, Niger): allied with Russia (AES), broke from ECOWAS. Africa Corps failing to degrade insurgencies.'},
  {s:'Somalia',  t:'Somalia',    type:'complex',  lb:'Somalia: Al-Shabaab + clan politics + election disputes + FGS coalition collapse. Multiple overlapping conflicts.'},
  {s:'Afghanistan',t:'Pakistan', type:'attack',   lb:'Afghanistan (Taliban) vs Pakistan: TTP cross-border attacks from Afghan soil. Taliban denies harbouring TTP; Islamabad disagrees.'},
  {s:'Pakistan', t:'Afghanistan',type:'attack',   lb:'Pakistan: airstrikes on Afghan territory targeting TTP positions. Kabul condemned strikes as act of war.'},
];

const isMobile = () => window.innerWidth <= 768;

// ── SHEET (mobile bottom sheet + arc tap) ──────────────────────────
const sheet     = document.getElementById('sheet');
const sheetTitle= document.getElementById('sheet-title');
const sheetBody = document.getElementById('sheet-body');
document.getElementById('sheet-close').onclick = closeSheet;
function closeSheet(){ sheet.classList.remove('open'); }
function openSheet(title, html){
  sheetTitle.textContent = title;
  sheetBody.innerHTML = html;
  sheet.classList.add('open');
}

// ── NODE PANEL (desktop) ───────────────────────────────────────────
const nodepanel = document.getElementById('nodepanel');
function closePanel(){ nodepanel.style.display='none'; resetDim(); hoveredNode=null; }

// ── FILTER TOGGLE (mobile) ─────────────────────────────────────────
const filterToggle  = document.getElementById('filter-toggle');
const filterDrawer  = document.getElementById('filter-drawer');
filterToggle.onclick = () => {
  const open = filterDrawer.classList.toggle('open');
  filterToggle.classList.toggle('open', open);
  filterToggle.textContent = open ? 'Done' : 'Filter';
};

(async () => {
  const wrap = document.getElementById('map-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const svg = d3.select('#wm').attr('viewBox', `0 0 ${W} ${H}`);

  const proj = d3.geoNaturalEarth1()
    .scale(Math.min(W/5.8, 155))
    .translate([W/2, H/2+20]);
  const geoPath = d3.geoPath().projection(proj);

  const root = svg.append('g').attr('id','map-root');

  root.append('path').datum({type:'Sphere'})
    .attr('d',geoPath).attr('fill','#0a1512').attr('stroke','none');
  root.append('path').datum(d3.geoGraticule()())
    .attr('fill','none').attr('stroke','#ffffff08').attr('stroke-width',0.4).attr('d',geoPath);

  const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');

  root.append('g').selectAll('path')
    .data(topojson.feature(world, world.objects.countries).features)
    .enter().append('path').attr('d',geoPath)
    .attr('fill',d=>{ const c=COUNTRY_COLORS[+d.id]; return c?c+'cc':'#1e2220'; })
    .attr('stroke','#ffffff14').attr('stroke-width',0.3);

  root.append('path').datum({type:'Sphere'})
    .attr('d',geoPath).attr('fill','none')
    .attr('stroke','#ffffff22').attr('stroke-width',0.6);

  const P = {};
  Object.entries(ACTORS).forEach(([k,v])=>{ P[k]=proj(v.ll); });

  const adj = {};
  ARCS.forEach(a=>{
    (adj[a.s]||(adj[a.s]=[])).push({dir:'→',other:a.t,type:a.type,lb:a.lb});
    (adj[a.t]||(adj[a.t]=[])).push({dir:'←',other:a.s,type:a.type,lb:a.lb});
  });

  const activeFilters = new Set(Object.keys(TYPES));
  let hoveredNode = null;
  window.hoveredNode = null;

  // ── ARCS ──────────────────────────────────────────────────────────
  const arcG = root.append('g').attr('id','arc-group');
  const tt = document.getElementById('tooltip');
  const pairN = {}, arcEls = [];

  ARCS.forEach(arc => {
    const s=P[arc.s], t=P[arc.t];
    if(!s||!t) return;
    const st=TYPES[arc.type];
    const dx=t[0]-s[0], dy=t[1]-s[1];
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len<2) return;
    const key=[arc.s,arc.t].sort().join('|');
    pairN[key]=(pairN[key]||0)+1;
    const n=pairN[key], sign=n%2===0?-1:1;
    const cv=Math.min(len*.22,55)*sign*Math.ceil(n/2);
    const cx=(s[0]+t[0])/2-(dy/len)*cv, cy=(s[1]+t[1])/2+(dx/len)*cv;

    const el=arcG.append('path')
      .attr('d',`M${s[0]},${s[1]} Q${cx},${cy} ${t[0]},${t[1]}`)
      .attr('class','arc-path')
      .attr('stroke',st.c).attr('stroke-width',st.w)
      .attr('stroke-dasharray',st.d||'none').attr('opacity',st.o)
      .attr('data-type',arc.type);

    // Desktop hover
    el.on('mouseenter',function(e){
      if(isMobile()) return;
      d3.select(this).attr('stroke-width',st.w*2.8).attr('opacity',1);
      tt.style.opacity='1'; tt.textContent=arc.lb;
    }).on('mousemove',function(e){
      if(isMobile()) return;
      tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-36)+'px';
    }).on('mouseleave',function(){
      if(isMobile()) return;
      d3.select(this).attr('stroke-width',st.w).attr('opacity',st.o);
      tt.style.opacity='0';
    });

    // Mobile tap
    el.on('click',function(e){
      if(!isMobile()) return;
      e.stopPropagation();
      openSheet(arc.s+' → '+arc.t,
        `<div class="row"><div class="type" style="color:${st.c}">${arc.type.toUpperCase()}</div>
         <div class="detail">${arc.lb}</div></div>`);
    });

    arcEls.push({el,arc,st});
  });

  // ── LABELS & DOTS (fixed overlay) ─────────────────────────────────
  const labelLayer = svg.append('g').attr('id','label-layer').style('pointer-events','none');
  const labelEls = {};

  Object.entries(ACTORS).forEach(([k,v])=>{
    const p=P[k]; if(!p) return;
    const dotR = isMobile() ? 6 : 4;
    const dot=labelLayer.append('circle').attr('class','node-circle')
      .attr('r',dotR).attr('fill',v.color).attr('stroke','#0d0f0e').attr('stroke-width',1.2)
      .attr('cx',p[0]).attr('cy',p[1]).style('cursor','pointer').style('pointer-events','all');

    const lx=v.la==='start'?8:v.la==='end'?-8:0;
    const txt=labelLayer.append('text').attr('class','node-lbl')
      .attr('text-anchor',v.la).attr('fill','#d4cfc0ee')
      .attr('font-size','9px').attr('font-family',"'Space Mono',monospace")
      .attr('x',p[0]+lx).attr('y',p[1]+v.dy).text(k);

    labelEls[k]={p,lx,dy:v.dy,dot,txt};

    dot.on('click',function(e){
      e.stopPropagation();
      if(hoveredNode===k){ hoveredNode=null; closePanel(); closeSheet(); resetDim(); return; }
      hoveredNode=k;

      const rels=adj[k]||[];
      const rowsHtml=rels.map(r=>{
        const col=TYPES[r.type].c;
        return `<div class="row" style="border-left-color:${col}">
          <div class="type" style="color:${col}">${r.type.toUpperCase()} ${r.dir} ${r.other}</div>
          <div class="detail">${r.lb}</div></div>`;
      }).join('')||'<div class="row"><div class="detail">No direct relationships</div></div>';

      if(isMobile()){
        openSheet(k, rowsHtml);
      } else {
        document.getElementById('np-name').textContent=k;
        document.getElementById('np-rows').innerHTML=rels.map(r=>{
          const col=TYPES[r.type].c;
          return `<div class="nprow">
            <div class="npt" style="color:${col}">${r.type.toUpperCase()} ${r.dir} ${r.other}</div>
            <span>${r.lb}</span></div>`;
        }).join('')||'<div class="nprow"><span>No direct relationships</span></div>';
        nodepanel.style.display='block';
      }

      arcEls.forEach(({el,arc,st})=>{
        const show=arc.s===k||arc.t===k;
        el.attr('opacity',show?1:.05).attr('stroke-width',show?st.w*1.8:st.w*.5);
      });
    });
  });

  svg.on('click',()=>{ hoveredNode=null; closePanel(); closeSheet(); resetDim(); });

  function resetDim(){
    arcEls.forEach(({el,arc,st})=>{
      const show=activeFilters.has(arc.type);
      el.attr('opacity',show?st.o:0).attr('stroke-width',st.w).attr('display',show?null:'none');
    });
  }

  // ── ZOOM ──────────────────────────────────────────────────────────
  const zoom=d3.zoom().scaleExtent([0.8,12]).on('zoom',e=>{
    root.attr('transform',e.transform);
    const t=e.transform;
    Object.values(labelEls).forEach(({p,lx,dy,dot,txt})=>{
      const sx=t.applyX(p[0]), sy=t.applyY(p[1]);
      dot.attr('cx',sx).attr('cy',sy);
      txt.attr('x',sx+lx).attr('y',sy+dy);
    });
    arcEls.forEach(({el,st})=>el.attr('stroke-width',st.w/Math.sqrt(t.k)));
  });
  d3.select('#wm').call(zoom);

  // ── FILTERS ───────────────────────────────────────────────────────
  function makeFilterBtns(container){
    Object.entries(TYPES).forEach(([type,ts])=>{
      const btn=document.createElement('button');
      btn.className='filter-btn on'; btn.textContent=type;
      btn.style.borderColor=ts.c+'88';
      btn.addEventListener('click',()=>{
        // sync both containers
        document.querySelectorAll(`.filter-btn[data-type="${type}"]`).forEach(b=>{
          if(activeFilters.has(type)){
            b.classList.remove('on'); b.style.borderColor='#2a2d2a'; b.style.color='';
          } else {
            b.classList.add('on'); b.style.borderColor=ts.c; b.style.color=ts.c;
          }
        });
        if(activeFilters.has(type)) activeFilters.delete(type);
        else activeFilters.add(type);
        resetDim();
      });
      btn.dataset.type=type;
      container.appendChild(btn);
    });
  }
  makeFilterBtns(document.getElementById('filter-strip'));
  makeFilterBtns(filterDrawer);

  // ── LEGEND (desktop) ──────────────────────────────────────────────
  const leg=document.getElementById('legend');
  Object.entries(TYPES).forEach(([,ts])=>{
    leg.innerHTML+=`<div class="li">
      <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4"
        stroke="${ts.c}" stroke-width="${ts.w}" stroke-dasharray="${ts.d||'none'}"/></svg>
      ${ts.label}</div>`;
  });
  leg.innerHTML+=`<span id="count-hint">${ARCS.length} relationships — scroll/pinch to zoom — tap node to inspect</span>`;
})();
</script>
</body>
</html>
